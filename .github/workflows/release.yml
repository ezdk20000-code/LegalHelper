# Собирает готовый установщик LegalHelper-Setup.exe на серверах GitHub и выкладывает его в «Releases».
# Запускается сам, когда в main меняется version.json (то есть выходит новая версия), или вручную
# (вкладка Actions → «Установщик» → Run workflow). Сайт и программа скачивают установщик по адресу
# https://github.com/ezdk20000-code/LegalHelper/releases/latest/download/LegalHelper-Setup.exe
name: Установщик

on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Версия $v"

      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller -c constraints-build.txt
          # pymupdf4llm (PDF → Markdown) в новых версиях требует движок нейросетей onnxruntime, а его
          # onnxruntime.dll конфликтует с одноимённой системной библиотекой Windows 11. В установщик их не берём:
          # для Markdown у программы есть свой способ (pdf_core._simple_markdown)
          python -m pip uninstall -y pymupdf4llm pymupdf_layout onnxruntime
          python -m pip list

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Свой стартовый файл PyInstaller
        shell: pwsh
        run: |
          # Стартовый файл PyInstaller (runw.exe → LegalHelper.exe) берёт из COMCTL32 функцию LoadIconMetric
          # (порядковый номер 380) — только чтобы нарисовать значок в окне ошибки. Она есть лишь в новой версии
          # COMCTL32, которую Windows выдаёт по манифесту; на некоторых компьютерах этого не происходит, и
          # программа не запускалась: «Порядковый номер 380 не найден … LegalHelper.exe». Собираем стартовый
          # файл сами, с обычным значком (LoadIconW, так предусмотрено в исходнике PyInstaller).
          $ver = (python -c "import PyInstaller; print(PyInstaller.__version__)").Trim()
          python -m pip download "pyinstaller==$ver" --no-deps --no-binary=:all: -d pyi_src
          tar -xzf (Get-ChildItem pyi_src\*.tar.gz).FullName -C pyi_src
          $root = (Get-ChildItem pyi_src -Directory | Select-Object -First 1).FullName
          $c = Join-Path $root "bootloader\src\pyi_exception_dialog.c"
          $txt = Get-Content $c -Raw
          $new = $txt -replace '#if 0(\s+dialog->hErrorIcon = LoadIconW)', '#if 1$1'
          if ($new -eq $txt) { throw "Не нашёл место с LoadIconMetric в $c" }
          Set-Content $c $new -NoNewline
          Push-Location (Join-Path $root "bootloader")
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "Стартовый файл не собрался" }
          Pop-Location
          $dst = python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel'))"
          Copy-Item (Join-Path $root "PyInstaller\bootloader\Windows-64bit-intel\*.exe") $dst.Trim() -Force
          python -m pip install pefile
          python -c "import pefile,sys,os; p=os.path.join(sys.argv[1],'runw.exe'); d=[e.dll.decode() for e in pefile.PE(p).DIRECTORY_ENTRY_IMPORT]; print(p, d); sys.exit(1 if any('COMCTL' in x.upper() for x in d) else 0)" $dst.Trim()
          if ($LASTEXITCODE -ne 0) { throw "В стартовом файле осталась зависимость от COMCTL32" }

      - name: Сборка программы
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --log-level WARN --name LegalHelper --icon app.ico
          --add-data "app.ico;." --add-data "tessdata;tessdata" --add-data "excalidraw;excalidraw" --add-data "help;help" --add-data "forms;forms"
          --collect-data pptx --collect-data docx --collect-all pdf2docx
          --hidden-import case_tabs --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebEngineCore
          --hidden-import legal_ui --hidden-import legal_core --hidden-import cases --hidden-import legal_data
          --hidden-import templates_lib --hidden-import help_ui --hidden-import updater --hidden-import timecheck
          --hidden-import backup --hidden-import casefile --hidden-import anim --hidden-import timer_widget
          --hidden-import extwatch --hidden-import tutorial --hidden-import help_content --hidden-import phone_export --hidden-import palette --hidden-import app_menu --hidden-import modern_ui --hidden-import folders_ui --hidden-import laws_auto --hidden-import doc_names --hidden-import rename_ui --hidden-import zoom_ui --hidden-import word_editor
          --exclude-module onnxruntime --exclude-module pymupdf.layout --exclude-module pymupdf4llm
          pdf_master.py

      - name: Библиотеки Visual C++ рядом с программой
        shell: pwsh
        run: |
          # Windows ищет системные DLL сначала в папке программы, потом в System32 и только потом во внутренних
          # папках сборки. На свежем компьютере в System32 бывают старые файлы Visual C++ — и программа
          # падала с «Порядковый номер … не найден». Кладём свежие копии (с этого сервера, где стоит
          # последняя версия Visual C++) прямо рядом с LegalHelper.exe и заменяем ими копии внутри сборки.
          $names = "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","msvcp140_atomic_wait.dll","msvcp140_codecvt_ids.dll",
                   "vcruntime140.dll","vcruntime140_1.dll","concrt140.dll","vcomp140.dll"
          $dist = "dist\LegalHelper"
          foreach ($n in $names) {
            $src = Join-Path $env:SystemRoot "System32\$n"
            if (-not (Test-Path $src)) { Write-Host "нет $n"; continue }
            Copy-Item $src $dist -Force
            Get-ChildItem $dist -Recurse -Filter $n | Where-Object { $_.DirectoryName -ne (Resolve-Path $dist).Path } |
              ForEach-Object { Copy-Item $src $_.FullName -Force }
            Write-Host "$n $((Get-Item $src).VersionInfo.FileVersion)"
          }
          if (Get-ChildItem $dist -Recurse -Filter "onnxruntime*.dll") { throw "В сборку попал onnxruntime" }
          python -c "import pefile,sys; d=[e.dll.decode() for e in pefile.PE(sys.argv[1]).DIRECTORY_ENTRY_IMPORT]; print(d); sys.exit(1 if any('COMCTL' in x.upper() for x in d) else 0)" "$dist\LegalHelper.exe"
          if ($LASTEXITCODE -ne 0) { throw "LegalHelper.exe всё ещё требует COMCTL32" }

      - name: Убрать из сборки то, чем программа не пользуется
        shell: pwsh
        run: |
          # Ничего из функций программы не убирается — только файлы, которые она никогда не открывает:
          # инструменты разработчика встроенного браузера, отладочные файлы, переводы Qt и браузера
          # на ~100 языков (оставляем русский и английский), модуль видео из OpenCV (нужен только для видео).
          $int = "dist\LegalHelper\_internal"
          $before = (Get-ChildItem dist\LegalHelper -Recurse -File | Measure-Object Length -Sum).Sum
          $rm = @()
          $rm += Get-ChildItem "$int\PySide6\resources" -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -like "*devtools*" -or $_.Name -like "*.debug.*" }
          $rm += Get-ChildItem "$int\PySide6\translations\qtwebengine_locales" -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notin @("ru.pak", "en-US.pak") }
          $rm += Get-ChildItem "$int\PySide6\translations" -File -Filter *.qm -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notlike "*_ru.qm" }
          $rm += Get-ChildItem "$int\cv2" -File -Filter "opencv_videoio_ffmpeg*.dll" -ErrorAction SilentlyContinue
          $rm | ForEach-Object { Write-Host ("убираю {0,8:N1} МБ  {1}" -f ($_.Length / 1MB), $_.FullName) ; Remove-Item $_.FullName -Force }
          if (-not (Test-Path "$int\PySide6\translations\qtwebengine_locales\ru.pak")) { Write-Host "нет ru.pak" }
          if (-not (Test-Path "$int\PySide6\translations\qtbase_ru.qm")) { Write-Host "нет qtbase_ru.qm — меню полей ввода будет по-английски" }
          $after = (Get-ChildItem dist\LegalHelper -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Размер программы: было {0:N0} МБ, стало {1:N0} МБ" -f ($before / 1MB), ($after / 1MB))
          Write-Host "Самые большие файлы:"
          Get-ChildItem dist\LegalHelper -Recurse -File | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { Write-Host ("{0,8:N1} МБ  {1}" -f ($_.Length / 1MB), $_.FullName.Replace((Resolve-Path dist).Path, "")) }

      - name: Проверка сборки
        shell: pwsh
        run: |
          if (-not (Test-Path dist\LegalHelper\LegalHelper.exe)) { throw "Нет dist\LegalHelper\LegalHelper.exe" }
          # пробный запуск: программа открывает главное окно без показа и сразу закрывается (код 0 — всё загрузилось)
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist\LegalHelper\LegalHelper.exe -ArgumentList "--selftest" -PassThru
          $done = $p.WaitForExit(180000)
          $log = Join-Path $env:TEMP "legalhelper_selftest.txt"
          if (Test-Path $log) { Get-Content $log -Encoding utf8 | Write-Host } else { Write-Host "отчёта нет" }
          if (-not $done) { $p.Kill(); throw "Пробный запуск завис" }
          if ($p.ExitCode -ne 0) { throw "Пробный запуск завершился с кодом $($p.ExitCode)" }
          Write-Host "Пробный запуск: OK"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup не найден" }
          & $iscc /Q "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с ошибкой $LASTEXITCODE" }
          Copy-Item installer_output\LegalHelper_Setup.exe installer_output\LegalHelper-Setup.exe
          Get-Item installer_output\*.exe | Format-Table Name, Length

      - name: Выпуск на GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $notes = "Установщик LegalHelper $v для Windows 10 и 11. Скачайте LegalHelper-Setup.exe, откройте его и нажимайте «Далее»."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag installer_output\LegalHelper-Setup.exe --clobber
          } else {
            gh release create $tag installer_output\LegalHelper-Setup.exe --title "LegalHelper $v" --notes $notes --target $env:GITHUB_SHA --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Не удалось выложить установщик" }

      - name: Выпуск в открытом месте для скачивания (без исходного кода)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Установщик, version.json и CHANGELOG.md — в репозиторий сайта LegalHelper/legalhelper.github.io.
          # Оттуда их берут программа и сайт, и исходный код можно держать закрытым.
          # Нужен секрет RELEASES_TOKEN (ключ с правом записи в репозиторий сайта); без него шаг пропускается.
          if (-not $env:GH_TOKEN) { Write-Host "::warning::Нет секрета RELEASES_TOKEN — установщик выложен только в старое место"; exit 0 }
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $repo = "LegalHelper/legalhelper.github.io"
          $notes = "Установщик LegalHelper $v для Windows 10 и 11. Скачайте LegalHelper-Setup.exe, откройте его и нажимайте «Далее»."
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag installer_output\LegalHelper-Setup.exe --clobber --repo $repo
          } else {
            gh release create $tag installer_output\LegalHelper-Setup.exe --repo $repo --title "LegalHelper $v" --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Не удалось выложить установщик в $repo" }
          git clone --depth 1 "https://x-access-token:$($env:GH_TOKEN)@github.com/$repo.git" site
          if ($LASTEXITCODE -ne 0) { throw "Не удалось открыть репозиторий сайта" }
          Copy-Item version.json, CHANGELOG.md site\ -Force
          Push-Location site
          git config user.name "LegalHelper release"
          git config user.email "release@legalhelper.local"
          git add version.json CHANGELOG.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "LegalHelper $v"
            git push
            if ($LASTEXITCODE -ne 0) { throw "Не удалось обновить version.json на сайте" }
          }
          Pop-Location
